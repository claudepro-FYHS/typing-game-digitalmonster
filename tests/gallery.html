<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#3a4068;color:#fff;font:12px sans-serif}
#g{display:flex;flex-wrap:wrap;gap:6px;padding:8px;align-items:flex-end}
#g div{text-align:center}
canvas{image-rendering:pixelated;display:block;margin:0 auto 2px}
</style></head>
<body><div id="g"></div>
<script src="/lib/three.min.js"></script><script src="/models.js"></script>
<script>
// Pixel-art gallery of every partner (rookie + evolved, front + back), enemy and boss.
// ?set=mechs|mechs2|enemies|bosses|evbosses   &pose=back|atk (optional)
const q = new URLSearchParams(location.search), set = q.get('set') || 'mechs', pose = q.get('pose') || '';
const g = document.getElementById('g');
function show(cv, label, s) {
  const w = document.createElement('div'), c = document.createElement('canvas');
  c.width = cv.width * s; c.height = cv.height * s;
  const x = c.getContext('2d'); x.imageSmoothingEnabled = false; x.drawImage(cv, 0, 0, c.width, c.height);
  w.appendChild(c); w.append(label); g.appendChild(w);
}
const A = MODELS.__artCanvas, o = { back: pose === 'back', atk: pose === 'atk' };
if (set === 'mechs' || set === 'mechs2') MODELS.MECHS.forEach((m, i) => {
  if (set === 'mechs' ? i >= 8 : i < 8) return;
  show(A('m', m, null, o), m.name, 4); show(A('m', m, null, Object.assign({ evo: 1 }, o)), m.evo, 4);
});
if (set === 'enemies') Object.entries(MODELS.ENEMY_TYPES).forEach(([k, e]) => { show(A('e', e, null, {}), k, 5); show(A('e', e, null, { atk: 1 }), k + ' (attack)', 5); });
if (set === 'bosses' || set === 'evbosses') MODELS.BOSSES.forEach(b => { if ((set === 'bosses') === !!b.event) return; show(A('b', b, null, o), b.name + (b.event ? ' (' + b.event + ')' : ''), 3); });
window.done = true;
</script></body></html>
